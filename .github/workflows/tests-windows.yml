# Runs the tests on Windows, on every supported version of PHP. Linux is the first-class platform (see tests.yml,
# and the README), and Windows is only supported in theory, so this is a separate workflow with its own badge: it
# shows how far Windows support has got, without turning the main "Tests" badge red. The Docker images the Linux
# tests use can't run on Windows, so PHP is installed on the runner directly.
name: Windows tests

on:
    push:
        branches:
            - master
            - main
            # TEMPORARY: also run on the overhaul branch, to find and fix what fails on Windows. Remove this line
            # once that is done, so it only runs on the main branch, like tests.yml.
            - overhaul
        tags:
            - "*"
    pull_request:
        branches:
            - master
            - main
    # Adds a "Run workflow" button on the Actions tab (only once this file is on the default branch).
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        name: Tests on Windows, PHP ${{ matrix.php }}
        runs-on: windows-latest
        timeout-minutes: 30

        strategy:
            # Run every version, even if one fails, to see all the failures at once.
            fail-fast: false
            matrix:
                php: ["8.3", "8.4", "8.5"]

        steps:
            - name: Check out the code
              uses: actions/checkout@v5

            # The same extensions as the Linux test images, apart from pcntl and posix, which Windows doesn't have.
            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, sodium, sockets, zip, curl, openssl
                  ini-values: zend.assertions=1, assert.exception=1
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run the tests
              run: php testing/main.php
